# Gitleaks config for acbu-backend
# Extends default rules; keep allowlists tight.

title = "acbu-backend"

[extend]
useDefault = true

[allowlist]
description = "Known safe paths and test fixtures"
paths = [
  '''\.env\.example$''',
  '''\.env\.test$''',
  '''docs/''',
  '''.*\.md$''',
]

# Intentionally do NOT allowlist .env.local — it must not be committed.

# ── Commit-scoped allowlist for test-fixture false positives ─────────────────
# These are dummy/placeholder values used in unit tests and CI env blocks.
# Each entry is pinned to its exact commit fingerprint so that a real secret
# added to the same file in a later commit would still be caught.
[[allowlist.commits]]
description = "tests/limits.test.ts — dummy JWT_SECRET test fixture"
commits = ["dd42d72cff860971def0a40c896532b261b5bd5b"]

[[allowlist.commits]]
description = ".github/workflows/ci.yml — CI env JWT_SECRET placeholder"
commits = ["43bacf1c569c22f9368b0f5f7bb2164c90bf182f"]

[[allowlist.commits]]
description = "tests/swapRace.test.ts — dummy JWT_SECRET test fixture"
